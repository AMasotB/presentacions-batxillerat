name: Regenera manifest.json

on:
  push:
    branches: [main]
    paths:
      - "infografies/**"
      - "activitats/**"
      - "apunts/**"
      - "scripts/generate_manifest.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Genera manifest.json
        run: python3 scripts/generate_manifest.py

      - name: Publica el manifest si ha canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet -- manifest.json; then
            git commit -m "Actualitza manifest.json"
            git push
          else
            echo "Cap canvi al manifest."
          fi
